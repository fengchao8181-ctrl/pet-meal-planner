<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>运营看板 · 宠物餐单 · 北极星漏斗</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    body.dash { background:#f4f5f7; padding:20px; font-family:-apple-system,Segoe UI,Roboto,"PingFang SC",sans-serif; color:#1a1a1a; }
    .dash-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .dash-head h1 { font-size:22px; margin:0; }
    .refresh { color:#888; font-size:12px; }
    .key-form { display:flex; gap:8px; align-items:center; margin-left:auto; }
    .key-form input { padding:6px 8px; border:1px solid #ccc; border-radius:6px; font-size:12px; }
    .key-form button { padding:6px 12px; border:0; border-radius:6px; background:#0a84ff; color:#fff; cursor:pointer; }
    .funnel { display:grid; gap:12px; margin:20px 0; }
    .fstep { height:46px; display:flex; align-items:center; padding:0 16px; border-radius:8px; color:#fff; font-size:14px; position:relative; }
    .fstep .cnt { font-weight:700; font-size:16px; }
    .fstep .rate { opacity:.9; font-size:12px; margin-left:8px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:14px 16px; }
    .card h3 { margin:0 0 10px; font-size:13px; color:#666; font-weight:600; }
    .card .big { font-size:26px; font-weight:700; }
    .card dl { margin:0; display:grid; gap:6px; }
    .card dl div { display:flex; justify-content:space-between; font-size:12px; }
    .card dd { font-weight:600; }
    .push-log { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:14px 16px; margin-top:16px; }
    .push-log h3 { margin:0 0 8px; font-size:13px; color:#666; }
    .push-log ul { margin:0; padding-left:18px; font-size:12px; color:#444; }
    .recent { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:14px 16px; margin-top:16px; }
    .recent h3 { margin:0 0 8px; font-size:13px; color:#666; }
    .recent table { width:100%; border-collapse:collapse; font-size:12px; }
    .recent th,.recent td { text-align:left; padding:4px 6px; border-bottom:1px solid #f0f0f0; }
    .recent th { color:#888; font-weight:600; }
    .err { color:#d70022; background:#ffeaea; padding:8px 12px; border-radius:6px; margin:12px 0; }
    .muted { color:#999; font-size:12px; }
  </style>
</head>
<body class="dash">
  <div class="dash-head">
    <h1>运营看板 · 有爱留存</h1>
    <span class="refresh" id="updatedAt">—</span>
    <div class="key-form">
      <input id="adminkey" type="password" placeholder="管理密钥 INTERNAL_KEY（可选）" autocomplete="off" />
      <button id="reloadBtn">刷新</button>
    </div>
  </div>

  <div id="errBar" class="err" style="display:none"></div>

  <section class="funnel" id="funnel"></section>

  <div class="cards">
    <div class="card" id="cardRetain"><h3>档案 → 付费 转化率</h3></div>
    <div class="card" id="cardCheckin"><h3>建档用户打卡率</h3></div>
    <div class="card" id="cardPush"><h3>每日推送触达/订阅</h3></div>
    <div class="card" id="cardOrder"><h3>客单价（分）</h3></div>
  </div>

  <div class="push-log" id="pushLog"><h3>推送日志</h3><p class="muted">暂无</p></div>

  <div class="recent" id="recent"><h3>最近事件明细</h3><p class="muted">暂无</p></div>

  <script src="./dashboard.js"></script>
</body>
</html>
